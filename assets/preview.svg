<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="JetBrainsMono Nerd Font, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#1a1b26"/>

  <text x="800" y="92" text-anchor="middle" font-size="54" font-weight="bold" fill="#c0caf5">Other Monitor Workspaces</text>
  <text x="800" y="146" text-anchor="middle" font-size="30" fill="#a9b1d6">Switch the <tspan fill="#9ece6a">other</tspan> screen's workspace. Stay where you are.</text>

  <!-- Left monitor: focused, unchanged -->
  <g transform="translate(110,200)">
    <rect x="0" y="0" width="620" height="380" rx="18" fill="#16161e" stroke="#7aa2f7" stroke-width="6"/>
    <rect x="18" y="18" width="584" height="40" rx="8" fill="#24283b"/>
    <g font-size="22" fill="#565f89">
      <text x="40" y="46">1</text>
      <rect x="66" y="24" width="34" height="28" rx="6" fill="#7aa2f7"/>
      <text x="76" y="46" fill="#1a1b26" font-weight="bold">2</text>
      <text x="116" y="46">3</text><text x="146" y="46">4</text>
    </g>
    <rect x="34" y="78" width="356" height="276" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="4"/>
    <g fill="#414868"><rect x="58" y="108" width="220" height="14" rx="7"/><rect x="58" y="138" width="290" height="14" rx="7"/><rect x="58" y="168" width="180" height="14" rx="7"/><rect x="58" y="198" width="250" height="14" rx="7"/></g>
    <rect x="58" y="228" width="12" height="24" fill="#c0caf5"/>
    <rect x="406" y="78" width="180" height="276" rx="10" fill="#24283b"/>
    <path d="M300,250 l0,44 l11,-11 l9,20 l8,-4 l-9,-19 l15,0 z" fill="#c0caf5" stroke="#1a1b26" stroke-width="2"/>
    <text x="310" y="430" text-anchor="middle" font-size="28" fill="#7aa2f7">You are here</text>
    <text x="310" y="468" text-anchor="middle" font-size="22" fill="#565f89">focus, window and pointer stay put</text>
  </g>

  <!-- Right monitor: the other one, switched 1 -> 3 -->
  <g transform="translate(870,200)">
    <rect x="0" y="0" width="620" height="380" rx="18" fill="#16161e" stroke="#414868" stroke-width="6"/>
    <rect x="18" y="18" width="584" height="40" rx="8" fill="#24283b"/>
    <g font-size="22" fill="#565f89">
      <text x="40" y="46">1</text><text x="70" y="46">2</text>
      <rect x="96" y="24" width="34" height="28" rx="6" fill="#9ece6a"/>
      <text x="106" y="46" fill="#1a1b26" font-weight="bold">3</text>
      <text x="146" y="46">4</text>
    </g>
    <rect x="34" y="78" width="270" height="276" rx="10" fill="#24283b"/>
    <rect x="320" y="78" width="266" height="130" rx="10" fill="#24283b"/>
    <rect x="320" y="224" width="266" height="130" rx="10" fill="#24283b"/>
    <text x="169" y="250" text-anchor="middle" font-size="120" font-weight="bold" fill="#9ece6a" opacity="0.9">3</text>
    <text x="310" y="430" text-anchor="middle" font-size="28" fill="#9ece6a">Other monitor → workspace 3</text>
    <text x="310" y="468" text-anchor="middle" font-size="22" fill="#565f89">numbered as its own bar shows it</text>
  </g>

  <path d="M1110,727 C1330,735 1440,700 1440,594" fill="none" stroke="#9ece6a" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Key chord -->
  <g font-size="30" font-weight="bold" text-anchor="middle">
    <g fill="#24283b" stroke="#565f89" stroke-width="3">
      <rect x="390" y="690" width="170" height="74" rx="12"/>
      <rect x="610" y="690" width="140" height="74" rx="12"/>
      <rect x="800" y="690" width="160" height="74" rx="12"/>
      <rect x="1010" y="690" width="90" height="74" rx="12" stroke="#9ece6a"/>
    </g>
    <g fill="#c0caf5">
      <text x="475" y="738">SUPER</text><text x="680" y="738">CTRL</text><text x="880" y="738">SHIFT</text>
      <text x="1055" y="738" fill="#9ece6a">3</text>
    </g>
    <g fill="#565f89"><text x="585" y="738">+</text><text x="775" y="738">+</text><text x="985" y="738">+</text></g>
  </g>
  <text x="800" y="830" text-anchor="middle" font-size="24" fill="#565f89">1..0 for workspaces 1–10 · focus can stay or follow · Omarchy 4.5 per-monitor workspaces</text>
</svg>
