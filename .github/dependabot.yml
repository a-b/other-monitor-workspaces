version: 2
updates:
  # Keeps the SHA-pinned actions current; the Omarchy validator pin is bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Let fresh releases age a week before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
